</style></head><body><header><div class="eyebrow">ART HISTORY · CHAPTER 05</div><h1>西洋近代繪畫<br>藝術史互動時間軸</h1><p>從新古典主義到抽象表現主義，沿著藝術發展的脈絡，探索藝術家如何重新定義形體、色彩與觀看世界的方式。</p><div class="tools"><button onclick="document.getElementById('preface').scrollIntoView()">開始探索 ↓</button><button onclick="window.print()">列印頁面</button></div></header><nav class="timeline-wrap"><div class="timeline" id="timeline"></div></nav><main><section style="padding:45px 0 20px"><div class="kicker">EXPLORE THE COLLECTION</div><h2 style="font-size:30px;margin:5px 0">依藝術流派探索</h2><p style="color:#6f7779">點選上方時間軸切換章節；點選圖片可放大欣賞。圖文以原始教材為基礎整理。</p><form class="google-search" action="https://www.google.com/search" method="get" target="_blank" role="search"><input id="search" class="search" type="search" name="q" placeholder="輸入關鍵字，使用 Google 搜尋…" aria-label="Google 搜尋關鍵字" required><button type="submit" aria-label="在新視窗搜尋 Google">Google 搜尋 ↗</button></form></section><div id="sections"></div></main><footer>西洋近代繪畫介紹及練習 · 數位教學展示版<br>WebDesign by小春；若發現資料的正確性有任何問題，歡迎指正。</footer><div class="viewer" id="viewer" onclick="this.classList.remove('open')"><button aria-label="關閉圖片">×</button><img id="big" alt="放大藝術作品"><div class="label" id="bigLabel"></div></div><script id="siteData" type="application/json">{"sections": [{"title": "新古典主義。浪漫主義", "intro": [{"subhead": "1.新古典主義(Neoclassicism)"}, "巴洛克與洛可可風格流行將近2世紀之後(17世紀初~18世紀末)，人們開始對於華麗的裝飾、充滿曲線及動感的繪畫風格失去興趣，加上在西元1748年龐貝古城被挖掘出來，崇拜古代的風潮日益高漲，因此這場欲重振古希臘、古羅馬的藝術活動便稱作「新古典主義」。", "新古典主義的多半取材自古代歷史君王的英勇事跡，構圖多呈靜態、均衡嚴謹；冷峻的色調與古羅馬雕刻般的立體感，是這時期繪畫的主要特色。", "代表作家："], "artists": [{"name": "大衛(Jacques-Louis David , 1748~1825)", "bio": ["出生於法國巴黎的大衛，是新古典主義繪畫的開創者，擅長以歷史性畫面來描寫現實事件的表現手法，加上他參與政黨的政治身份，因此成為了拿破崙的宮廷畫家。大衛非常讚揚拿破崙的豐功偉業，而他也將拿破崙對古代憧憬的意念融入他的作品之中。他作品有著平衡理智的構圖，人物造型極為嚴謹，古典油畫技巧十分純熟，善於處理戲劇性的人物動態和場面，在畫中常常使用強烈的光影對比突出主體人物。"]}, {"name": "安格爾(Jean Auguste Dominique Ingres, 1780~1867)", "bio": ["安格爾自小父親就培養他對藝術的興趣，17歲時拜入大衛門下學畫，他師承大衛的新古典主義，並將其風格更往前推進一步，大衛所創作的作品，具有為社會與國家政治而創作的意識；而安格爾的藝術表現，則是更純粹的體現古代希臘羅馬藝術典範，有著強烈的唯美傾向。安格爾的畫風線條工整、輪廓確切、色彩明晰、構圖嚴謹，這樣的風格與後起的「浪漫主義」產生了概念上的對立。"]}, {"name": "哥雅(Francisco de Goya, 1749~1828)", "bio": ["哥雅小時家境貧寒，沒有受過正規的教育，一直到14歲才開始正式習畫，後來成為西班牙浪漫主義重要的代表畫家。繪畫風格從早期巴洛克式的風格，到大膽的突破古典繪畫題材和構圖的限制，自由而率真地表現時代下的生活和鬥爭，最後甚至趨於印象派的形式，一生畫風多變。他的作品對十九世紀法國繪畫的影響甚鉅，有著承前啟後的作用，對於現實主義畫派、浪漫主義畫派和印象派都有很大的影響。"]}, {"name": "傑利柯(Théodore Géricault, 1791~1824)", "bio": ["傑利柯是法國浪漫主義畫派的先驅，獨立而富裕的經濟狀況，使他能無後顧之憂的在繪畫上投注大量的心力。成長於法國大革命和拿破崙王朝混亂年代的他，喜歡從現實社會事件取材，並積極探索新的表現方法，對浪漫主義畫派和現實主義的發展有重要影響。"]}], "works": [{"number": 4, "caption": "大衛／自畫像／1794／81 cm × 64 cm／法國巴黎羅浮宮藏", "description": [], "images": [{"src": "images/04_0.jpg", "name": "圖 5-04大衛自畫像.jpg"}]}, {"number": 5, "caption": "大衛／加冕禮／1805 ~ 1807／610 cm × 931 cm／法國巴黎羅浮宮藏", "description": ["這幅畫作描寫了拿破崙在聖母院舉行的加冕儀式結束時的一剎那。莊嚴穩重的的構圖，配合鮮艷奪目的色光及聚焦的光影效果，使這幅畫成為了宮廷畫中非常經典的作品。"], "images": [{"src": "images/05_0.jpg", "name": "圖 5-05 局部.jpg"}, {"src": "images/05_1.jpg", "name": "圖 5-05加冕禮.jpg"}]}, {"number": 6, "caption": "大衛／荷拉斯兄弟之誓／1784／326 cm × 420 cm／法國巴黎羅浮宮藏", "description": ["以理性、平穩的構圖，呈現出古羅馬時期三兄弟向父親立下誓言以表保家衛國決心的故事，畫面中男人們剛直線條的手腳、與女人癱軟無力的曲線對比出極度英雄主義的色彩。此幅作品於法國大革命前所繪製，作者以這幅作品來教育國民-「愛國之心」為最高的道德標準，要把國家擺在民族跟信仰之前，這是最典型新古典主義式的理性與主題。"], "images": [{"src": "images/06_0.jpg", "name": "圖 5-06荷拉斯兄弟之誓.jpg"}]}, {"number": 7, "caption": "安格爾／自畫像／1804／78 cm × 61 cm／法國孔德博物館藏", "description": [], "images": [{"src": "images/07_0.jpg", "name": "圖 5-07安格爾.jpg"}]}, {"number": 8, "caption": "安格爾／大宮女／1814／91 cm × 162 cm／法國巴黎羅浮宮藏", "description": ["安格爾在追求極度唯美的理性思想中，放棄了很多不必要的細節，使之統一在一片安詳靜謐的和諧氣氛之中，並且放大了背脊、雙臂和大腿的比例，在不完美的比例中表現出古典的唯美。"], "images": [{"src": "images/08_0.jpg", "name": "圖 5-08.png"}, {"src": "images/08_1.jpg", "name": "圖 5-08草圖.jpg"}]}, {"number": 9, "caption": "安格爾／泉／1856／163 cm × 80 cm／法國巴黎奧塞美術館藏", "description": ["這幅作品在安格爾縝密的計算下，畫面呈現出有如音樂般流暢的形體與線條，色彩運用得非常柔和而富於變化，表現出莊嚴肅穆的美，被媲美於希臘古典時期的維納斯大理石像。"], "images": [{"src": "images/09_0.jpg", "name": "圖 5-09.jpg"}]}, {"number": 10, "caption": "哥雅／自畫像／1815／78 cm × 61 cm／馬德里普拉多博物館藏", "description": [], "images": [{"src": "images/10_0.jpg", "name": "圖 5-10歌雅.jpg"}]}, {"number": 11, "caption": "哥雅／1808 年 5 月 3 日／1814／266cm × 345 cm／馬德里普拉多博物館藏", "description": ["這是一幅描繪法軍以暴力鎮壓西班牙的悲劇性作品。運用構圖、光影及色彩的巧妙安排，讓觀者的視線落在畫中高舉雙手的市民身上，義正詞嚴痛斥敵人暴行，構成一幅英雄主義悲壯激昂的畫面。"], "images": [{"src": "images/11_0.jpg", "name": "圖 5-11《1808年5月3日》(The Third of May 1808)，1814年，收藏於西班牙馬德里普拉多博物館.jpg"}, {"src": "images/11_1.jpg", "name": "圖 5-11局部.jpg"}]}, {"number": 12, "caption": "哥雅／巨人／1808~1812／116 cm × 105 cm／馬德里普拉多博物館藏", "description": ["這幅作品是描繪的是羅馬神話中的農神，為了防止自己子女爭奪統治權，而將孩子一個個吃掉的故事。哥雅透過這幅作品，表現法國軍隊侵略西班牙時的殘酷暴行。"], "images": [{"src": "images/12_0.jpg", "name": "圖 5-12《巨人》(The Colossus)，1808年到1812年，收藏於西班牙馬德里普拉多博物館.jpg"}]}, {"number": 13, "caption": "傑利柯／自畫像／1808／21 x 14 cm／油彩．畫布／私人收藏", "description": [], "images": [{"src": "images/13_0.jpg", "name": "圖 5-13傑利柯self-portrait-1.jpg"}]}, {"number": "13-2", "caption": "傑利柯(Théodore Géricault, 1791~1824)／《梅杜莎之筏》／1818／491 × 716 cm／油彩／法國巴黎羅浮宮藏", "description": [], "images": [{"src": "images/13-2_0.jpg", "name": "圖 5-13-2 傑利柯《梅杜莎之筏》"}]}, {"number": 14, "caption": "傑利柯／在羅馬沒有馬術師的賽馬／1817／44.6 x 59.4 cm／油彩．畫布／美國沃爾特斯藝術博物館藏", "description": ["在畫面上可以看到一道明顯的斜線做構圖上的切割，讓作品呈現一種傾斜不平穩的構圖，以不被馴服的馬匹表現不受約束的生命力。"], "images": [{"src": "images/14_0.jpg", "name": "圖 5-14 .jpg"}]}, {"number": 15, "caption": "傑利柯／皇家的騎兵軍官／1814／油彩．畫布／349 x 266 cm／法國巴黎羅浮宮藏", "description": ["這幅是傑利柯第一次參加沙龍展的作品，描繪軍官在前線作戰，轉過身來激勵部下前進的姿態與馬用後腳站立的動作形成一體，強烈的動感讓畫面更有劇戲效果。這幅畫作相較於新古典主義的拿破崙畫像，無論在景物、姿態、甚至取材上(選擇前線爭戰的軍官，而非君王)，都表現出浪漫主義以不安、驚恐、勇敢等情緒，來找尋生命價值的精神。"], "images": [{"src": "images/15_0.jpg", "name": "圖 5-15.jpg"}]}, {"number": 16, "caption": "大衛／拿破崙越過阿爾卑斯山／1804／油彩．畫布／270 x 232 cm／法國瑪美松城堡國家美術館藏", "description": [], "images": [{"src": "images/16_0.jpg", "name": "圖 5-16Jacques_Louis_David.jpg"}]}]}, {"title": "寫實主義。自然主義", "intro": [{"subhead": "1. 寫實主義"}, "在浪漫主義後期，創作者為了盡情的表達內心的情感，使作品的題材逐漸脫離日常生活的範疇，產生了距離感。之後有畫家便開始把注意力轉向生活週遭的事物，他們認為藝術應該要完全忠實的呈現人們的生活，捨棄掉英雄史詩般的戲劇效果。他們不模仿古代風格，也不畫沒看過、不存在的事物，以最貼近平民百姓的日常生活為題材創作，這個藝術風格稱之為「寫實主義」。", "自然主義", "在寫實主義的風潮之下還流行著另一種繪畫風格-「自然主義」。它和寫實主義一樣，都是以描繪日常生活事物為主題。自然；而自然主義則是會帶入個人主觀的想法。畫家希望以個人的觀點及技巧來補捉他們眼中的「自然」。而這群畫家一起將畫室搬到了法國巴黎附近的巴比松村(Barbizon)附近的楓丹白露森林(Fontainebleau Forest)中，因此有人將他們稱之為「巴比松畫派」，他們希望在這片森林中，補捉瞬息萬變的自然之美。", "寫實主義代表畫家："], "artists": [{"name": "庫爾貝(Gustave Courbet, l819 ~ 1877)", "bio": ["庫爾貝來自法國東部的農村，現實主義畫派的創始人。他喜愛具體和實在的東西，正如同他曾說過的：「我沒看過天使，我如何能畫出天使呢？」他的用心的去觀察身邊每一個美好的事物。對於一草、一木、一塊岩石、一片雲朵，都細心研究它們的形狀、大小和質量感，追求的是絕對的存在", "。庫爾貝家鄉的農民、工人都是他創作的題材。他的畫作中，表現出樸實又真切的生命力，洋溢著濃厚的當代性。"]}, {"name": "杜米埃（Honore Daumier, l808 ~ 1879）", "bio": ["杜米埃出生於法國馬賽，13歲時父親精神失常，他只好四處打工謀生，因此十分了解社會中下階層人民的生活。他的油畫創作多以普通勞動者和賣藝人的生活為題材，運用強烈的線條筆觸與明暗對比來突顯人物形象，粗獷而真實，富有原創性。但是，他的作品一向不受重視，直到去世前一年，在巴黎辦了第一次油畫展。在他死後，他的作品才震撼了美術界。"]}, {"name": "柯洛(Jean Baptisite Camille Corot, 1796~1875)", "bio": ["柯洛出生於一個富裕的中產階級家庭，年輕的時候他喜歡遍遊法國各地，並在描繪自然環境中描繪風景畫，他的畫作以精確捕捉光影色調的變化，以及營造空間感十足的遠近層次而聞名。他是第一個搬到巴比松(Barbizon)村莊的畫家，也是自然主義畫派的領導人物，個性開朗、樂於助人，曾救濟晚年為失明所苦的杜米埃一棟房子，他一生共畫了三千多幅作品，但生前一幅都沒賣出去過。"]}, {"name": "米勒(Jean Francois Millet，l814 - 1875)", "bio": ["米勒出身於農村子弟，他以真實描繪農村生活而聞名，是法國巴比松畫派中最廣為人知的田園畫家之一。米勒在35歲時遷居至巴比松，從此創作的主題便離不開農民生活，因此也有了「農民畫家」的美譽。透過與農民近距離的觀察與描寫，他想表達的是人類樸實的情感，寧靜、真誠中所流露出崇高的情操。"]}], "works": [{"number": 17, "caption": "庫爾貝／絕望的人(自畫像)／1843~1845／油彩．畫布／45 x 54 cm／私人收藏", "description": [], "images": [{"src": "images/17_0.jpg", "name": "圖 5-17庫爾貝Gustave Courbet.jpg"}]}, {"number": 18, "caption": "庫爾貝(Gustave Courbet, l819 ~ 1877)／翻騰的大海 (The Stormy Sea)／1869／油彩‧畫布／54 x 75 cm／私人收藏", "description": ["從庫爾貝所描繪的大海與雲朵便可看出，寫實主義對於自然奇景的追求，他細心的研究、表現出這自然景觀的每一個小細節，利用色彩間的搭配，灰色的雲層、落日的餘暉和前景中泡沫似的浪濤互相融合，使之渾然一體。"], "images": [{"src": "images/18_0.jpg", "name": "圖 5-18庫爾貝The Stormy Sea.jpg"}]}, {"number": 19, "caption": "庫爾貝(Gustave Courbet, l819 ~ 1877)／畫室裡的畫家(The Painter's Studio) ／1855／油彩‧畫布／359 x 598cm ／法國巴黎奧塞美術館藏", "description": ["庫爾貝將自己與女模特兒畫在畫面中央，左邊是來自鄉下的農夫、牧師、獵人，而另一邊則是他在巴黎知識界的友人。裸體女模特兒與兒童象徵著自然與純真，他以這幅畫來宣示寫實主義中「真實而美」的理念。"], "images": [{"src": "images/19_0.jpg", "name": "圖 5-19庫爾貝(局部).jpg"}, {"src": "images/19_1.jpg", "name": "圖 5-19庫爾貝.jpg"}]}, {"number": 20, "caption": "杜米埃／站在畫作前的畫家自畫像／ 約1866／油彩‧木板／33.5 x 27 cm／美國華盛頓菲力浦陳列館藏", "description": [], "images": [{"src": "images/20_0.jpg", "name": "圖 5-20.jpg"}]}, {"number": 21, "caption": "杜米埃／三等車箱／ 1863~1865／油彩‧畫布／65.4 x 90.2 cm／紐約大都會美術館", "description": ["這幅作品是他最著名的作品之一，畫面中一群在工業文明下受到壓迫的人民，坐在擁擠的車廂中靜默沉思，他們對於貧窮的生活感到無奈。無力改變現況，只能默默的承受著，杜米埃的社會寫實主義，為時代留下了最直接的見證。"], "images": [{"src": "images/21_0.jpg", "name": "圖 5-21杜米埃The Third-Class Carraige.jpg"}]}, {"number": 22, "caption": "杜米埃(Honore Daumier, l808 ~ 1879)／暴動／ 1860 ／油彩‧畫布／87.6 x 113 cm ／美國華盛頓菲力浦陳列館藏", "description": ["這幅作品是他替報紙所繪製的插圖，主要在表達勞工與中產階級間的抗爭活動。他畫過不少作品來諷刺時事與政治家，也曾因此被捕入獄。而生性開朗的他身邊總圍繞著許多朋友支持著他，如柯洛、德拉克洛瓦等。", "自然主義代表畫家："], "images": [{"src": "images/22_0.jpg", "name": "圖 5-22杜米埃The Uprising.jpg"}]}, {"number": 23, "caption": "柯洛／自畫像／1840／油彩‧畫布／25 x 33 cm／義大利浮羅倫斯烏菲茲美術館藏", "description": [], "images": [{"src": "images/23_0.jpg", "name": "圖 5-23.jpg"}]}, {"number": 24, "caption": "柯洛／沙特爾大教堂／1830 ／油彩‧畫布／62 x 50 cm／法國巴黎羅浮宮", "description": ["這幅作品是柯洛知名的代表作之一，他透過色調的運用與構圖的安排，把自然界的景物跟教堂結合在一起，暗示著人與大自然的並重的關係。"], "images": [{"src": "images/24_0.jpg", "name": "圖 5-24Jean-Baptiste-Camille_Corot_-_The_Cathedral_of_Chartres_-_WGA5282.jpg"}]}, {"number": 25, "caption": "柯洛／早晨時光下仙女之舞／1850 ~ 1851／油彩‧畫布／98 x 131cm／法國巴黎奧塞美術館", "description": ["在這幅作品中，可以清楚的感受到柯洛作品的中那種自然、樸素，以及充滿迷矇的空間感。他的筆觸柔和，構圖簡單，但富涵詩意，被譽為19世紀最出色的抒情風景畫家。"], "images": [{"src": "images/25_0.jpg", "name": "圖 5-25柯洛_早晨時光下仙女之舞.jpg"}]}, {"number": 26, "caption": "米勒／自畫像／1840~1841／油彩‧畫布／63.5 x 47 cm／美國波士頓現代美術館藏", "description": [], "images": [{"src": "images/26_0.jpg", "name": "圖 5-26米勒自畫像.jpg"}]}, {"number": 27, "caption": "米勒／晚禱／1857 ~ 1859 ／油彩‧畫布／55.5 x 66 公分／法國巴黎奧塞美術館藏", "description": ["畫面中兩位年輕夫婦聽到向晚的鐘聲，虔誠的低頭向神禱告。他們彷復在頌揚著大自然給予人類的恩賜，平靜知足的氣氛，表現出農村生活最單純、動人的一刻。超現實主義畫家-達利，也曾多次臨摹過這幅經典之作。"], "images": [{"src": "images/27_0.jpg", "name": "圖 5-27.jpg"}]}, {"number": 28, "caption": "達利／米勒晚禱的考古學回憶／1935 ／油彩‧畫布／31.8 x 39.5 公分／美國佛羅里達州聖彼得堡達利美術館藏", "description": ["達利曾說過，米勒的\u003c晚禱>是啟蒙他藝術創作的第一張作品，利過對於名畫的模仿，表達出對勒的敬意。"], "images": [{"src": "images/28_0.jpg", "name": "圖 5-28.jpg"}]}, {"number": 29, "caption": "米勒／拾穗／1857／油彩．畫布／54 x 66 公分／法國巴黎羅浮宮藏", "description": ["畫中三個農婦，在秋收後的黃昏揀拾麥穗，卑微的姿勢在金黃夕陽餘輝映襯之下，散發出聖潔的光茫，流露出米勒對勞動階級的敬重之意。"], "images": [{"src": "images/29_0.jpg", "name": "米勒《拾穗》（上傳檔名圖5-27，依作品內容配對至圖5-29）"}]}, {"number": 30, "caption": "米勒／拾穗草圖／1855~1856／墨水‧素描紙張／36.2x 49.5 cm／紐約大都會藝術博物館藏", "description": [], "images": [{"src": "images/30_0.jpg", "name": "圖 5-30.jpg"}]}]}, {"title": "印象主義", "intro": ["十九世紀前半段的藝術風格都十分重視作品的內容情節，例如：新古典主義偏好歷史、宗教相關題材，浪漫主義則取材於文學故事和英雄情懷，寫實主義力圖描繪普通的勞動者的日常生活，一直演變到後來的印象主義(Impressionism)，藝術家們開始對於作品描繪的主題、情節不作過多的著墨，他們主要關心的是對於繪畫形式的探索與追求。透過對於光線變化的觀察、顏料調合相混的色彩效果、線條筆觸的轉換運用，來產生視覺上的刺激。印象主義使往後的繪畫變得更自由、更豐富，藝術家們彷彿得到解放一樣，勇於嘗試更多元的表現方式。", "而印象主義依照時期、以及風格的不同，主要可以分成三個階段：印象主義、新印象主義、後印象主義。以下將針對這三個時期逐一說明：", "印象主義(前期)：", "1874年的法國巴黎，一群新進畫家想走出不同於當時學院派(註)的藝術風格，所以便聚在一起辦了畫展，當時一位叫莫內(Monet)的畫家，畫了一幅名為\u003c日出．印象>的畫作，作品中所有物件的形體糊模不明確、筆觸大膽，最大的特色是表現出藝術家眼中日出時分天空的色彩，一位藝術專欄記者語帶貶意的評論這個展覽，認為他們的作品正如其名，真是「印象」之作。從此這群畫家便自稱為「印象派」畫家，為藝術風格開創出一個嶄新的時代。", "註:這裡所指的學院派，是在新古典主義和浪漫主義運動之後，受法蘭西藝術院訂立的標準所影響的畫家和藝術品，以及與其風格相近的創作模式。"], "artists": [{"name": "馬奈(Édouard Manet, 1832~1883)", "bio": ["馬奈出生於法國，父親是巴黎法官，家境富裕。雖然未曾真正的參加過印象主義的展覽，但是他那相信自己眼睛所見，並企圖把這些貼近科學的光影與色彩表現出來的精神，可以說是引領印象主義發展的先驅。相較與當時學院派的完美而細膩的畫風，馬奈的畫風粗曠不精緻、講求攝影式的燈光利用，這樣的想法在當時，顯得特別前衛而不被眾人所接受，但這樣的觀念大大的影響了隨後興起的印象派畫家們。"]}, {"name": "莫內 (Claude Monet, 1840~1926)", "bio": ["莫內出生於法國巴黎，少年時代所畫的諷刺漫畫就已具備了驚人的描繪能力，1874年莫內與一群藝術家為了挑戰當時學院派的繪畫，獨立舉辦了與官方沙龍相抗衡的畫展，他的一幅作品開啟了印象主義的大門。在他的作品當中，看不到明顯的陰影邊界、與輪廓線，他擅於表現細膩的色彩變化。運用筆觸與色彩的交疊，詮譯出藝術家本身直觀的視覺經驗。", "他晚期的作品著重於在不同光線和空氣下變化下，描繪同一個主題。因此被記錄在畫布上的，不是所見物體的本身，而是觀看的過程。莫內一生致力於印象主義畫派的創作，與其理念的推動，因此可以說是「印象主義之父」。"]}, {"name": "雷諾瓦(Pierre-Auguste Renoir, 1841 ~ 1919)", "bio": ["雷諾瓦出生於法國一個裁縫師之子，童年時期曾在瓷器工廠工作，他的藝術才能使他得到繪畫相關的工作機會。僅管年少時經濟生活困苦，他仍與志同道合的畫家朋友們到戶外寫生，他們不精確描繪著自然景物，企圖捕捉大自然的光線與色彩的奧秘。而自從印象主義畫家開始齊聚行動後，他的繪畫主題便從自然轉向對人的關注。他對生命、愛情以及美麗事物充滿創作的熱情，於是經常繪製歌頌生命、充滿幸福的作品。"]}, {"name": "秀拉(Georges Seurat, 1859 ~ 1891)", "bio": ["秀拉透拉18歲時進入巴黎美術學院習畫，受印象主義畫家們、以及雪弗勒(Chevreul Michel Eugene, 1786~1889)的《色彩調和與對比原理》影響*註，發展出一套獨特的混色技法，運用許多細小的筆觸，整齊而密集排列的彩色小點，就可造成「並置混色」的效果，而這樣的繪畫技法也被稱作為－點描畫派(Pointism)。秀拉是一位安靜且專注的畫家，他不曾對朋友透露自己的私生活，年僅三十一歲去逝後，大家才知道他有妻小。", "註：雪弗勒為法國化學家，曾提出過與色彩原理相關理論，詳情請見《色彩原理》p.xx"]}, {"name": "希涅克(Paul Signac, 1863~1935)", "bio": ["希涅克出生在巴黎，18歲即開始專門從事繪畫，年輕時曾繞歐洲海岸航行，因此作品常出現港口沿岸的風光。21歲時認識了秀拉，並深深的被他繪畫的方式與理論所吸引，隨即加入了點描創作的行列，而在透拉過世之後，希涅克便成了點描畫派的領導人物。而點描所使用的並置混色雖然不會使顏色相混後變得混濁，但卻也無法自由的描繪形狀與輪廓，到了後期反而逐漸變得難以發展。"]}, {"name": "塞尚(Paul Cezanne, 1839~1906)", "bio": ["塞尚為法國一個富裕銀行家的長男，因為自覺不適合從商，因此在好友左拉(Émile Zola, 1840~1902)邀約之下，前往巴黎學畫，並立志成為一名畫家。塞尚曾加入印象主義，並兩次參與印象主義畫展，展覽中他的作品雖然也採用印象主義的細碎筆觸，不過其作品中穩定而牢固的畫面構成，仍然有別於其他的印象派畫家。他認為：「線是不存在的，明暗也不存在，只存在色彩之間的對比。物體的形象是由準確的色調相互襯托對比表現出來的。」並強調物體的立體感「提出「一切物體均可還原為圓錐、球體、圓柱」這樣的創新思維不僅超越了印象主義，甚至大大影響了往後「野獸主義」、「立體主義」的誕生，因此塞尚具有「現代繪畫之父」的美譽。"]}, {"name": "梵谷(Vincent van Gogh, 1853~1890)", "bio": ["梵谷是出生於荷蘭北部，是一名牧師之子。曾在畫廊工作過、曾任教於郊區國小、也曾擔任過一名傳教士，但後來因為認為宗教無法真正幫助到窮困的人民，因此27歲時才決定全心投入藝術創作。在弟弟西奧的幫助之下，他前往巴黎，開始接觸許多印象主義畫家的作品，如高更、秀拉、羅特列克等，並在那裡接觸到日本浮世繪，使他在色彩的使用以及構圖上產生很大的影響。他的作品用色鮮豔、筆觸鎖碎而激烈，他以直觀的情感，解放了現代主義的色彩表現，把現代主義的色彩領拓展得更為寬闊，使他成為了印象派後期極具代表性的藝術家之一。"]}], "works": [{"number": 31, "caption": "馬奈／手持調色盤的自畫像／1879／油彩‧畫布／83x67 cm／ 私人收藏", "description": [], "images": [{"src": "images/31_0.jpg", "name": "圖 5-31 馬奈自畫像.jpg"}]}, {"number": 32, "caption": "馬奈／奧林匹亞／1863／油彩‧畫布／130 cm × 190 cm／法國巴黎奧賽美術館藏", "description": ["這幅畫中，馬奈充分的表現出不同光影照射下，物體所呈現的色彩變化。前景、中景光線充足，畫中的女性顯得輪郭清楚、膚色明亮，對比於後景隱沒至黑暗之中的黑人女僕，而形成強烈的視覺效果。"], "images": [{"src": "images/32_0.jpg", "name": "圖 5-32 馬奈《奧林匹亞》"}]}, {"number": 33, "caption": "馬奈／酒館女侍／1881-1882／油彩‧畫布／96 cm × 130 cm／英國倫敦柯賽特藝廊藏", "description": ["畫面中優雅的女服務生穿著制服，她與櫃台上的酒瓶、水果是真實世界，而整個背景則是鏡子所反射出來的環境，巧妙的安排讓觀看畫作的群眾，刹時成了與服務生交談的客人，隨意而生動的構圖，打破了主角、配角間的關係。"], "images": [{"src": "images/33_0.jpg", "name": "圖 5-33馬奈_佛利貝爾傑酒店(局部).JPG"}, {"src": "images/33_1.jpg", "name": "圖 5-33馬奈_佛利貝爾傑酒店.jpg"}]}, {"number": 34, "caption": "莫內／自畫像／1886／油彩‧畫布／56×46 cm／ 私人收藏", "description": [], "images": [{"src": "images/34_0.jpg", "name": "圖 5-34莫內自畫像.jpg"}]}, {"number": 35, "caption": "莫內／印象．日出／1873／油彩、畫布／48 x 63 cm／巴梨蒙馬特美術館藏", "description": ["在一次的沙龍展上，藝評家對於這幅畫的批評，帶出了印象主義的開端。所有傳統觀念中的內容或形式，在這幅畫中都已經不復存在，只有光線和空氣才是主題。"], "images": [{"src": "images/35_0.jpg", "name": "圖 5-35.jpg"}]}, {"number": 36, "caption": "莫內／蒙特葛耶街的旗海／1878／油彩‧畫布／33 cm × 62 cm／法國盧昴美術館藏", "description": ["巴黎街上掛飄揚旗海的景致作品，熱鬧的色彩交織與躍動的筆觸表現，構成明亮而具喜氣的畫面。"], "images": [{"src": "images/36_0.jpg", "name": "圖 5-36莫內-The-Rue-Saint-Denis.jpg"}]}, {"number": 37, "caption": "雷諾瓦／自畫像／1876／油彩‧畫布／70.8 x 54.61 cm／美國麻州劍橋哈佛大學美術館", "description": [], "images": [{"src": "images/37_0.jpg", "name": "圖 5-37雷諾瓦-self-portrait.jpg"}]}, {"number": 38, "caption": "雷諾瓦／劇院包廂／ 1874／油彩‧畫布／ 80 x 63.5 cm／英國倫敦柯賽特藝廊", "description": ["雷諾瓦根據戲院裡的印象，畫出了包廂當中盛裝的貴婦以及其男伴。貴婦身上的黑、白條紋，再加上玫瑰紅的點綴顯得非常醒目，可以注意他描繪背景的紳士時，刻意放鬆了筆觸，營造出空間感，也許也是想表現出「印象不清」的意象。"], "images": [{"src": "images/38_0.jpg", "name": "圖 5-38雷諾瓦The Theater Box (局部).jpg"}, {"src": "images/38_1.jpg", "name": "圖 5-38雷諾瓦The Theater Box.jpg"}]}, {"number": 39, "caption": "雷諾瓦／煎餅磨坊的舞會／ 1876／ 油彩‧畫布／131 x 175cm ／法國巴黎奧塞美術館藏", "description": ["多數印象主義的畫家運用色彩的方式，來自於科學的根據，他們不喜歡使用現實中不存在的黑色，而雷諾瓦可以說是唯一擅長使用黑色的印象主義畫家。他使用細小、明亮和多彩的筆觸表現樹林光影，，描繪出巴黎社交生活中的喧嘩景象和氣息。"], "images": [{"src": "images/39_0.jpg", "name": "圖 5-39雷諾瓦Ball at the Moulin de la Galette.jpg"}]}, {"number": 40, "caption": "雷諾瓦／彈鋼琴的少女／1892／ 油彩‧畫布／116 x 90 ／法國巴黎奧塞美術館藏", "description": ["雷諾瓦後期的作品以頌揚女性美及兒童清純的肖像畫最為著名，運用柔和的色彩配置來表現出幸福歡樂的氛圍。"], "images": [{"src": "images/40_0.jpg", "name": "圖 5-40雷諾瓦Girls at the Piano.jpg"}]}, {"number": 41, "caption": "秀拉照片", "description": [], "images": [{"src": "images/41_0.jpg", "name": "圖 5-41秀拉照片_他沒自畫像.jpg"}]}, {"number": 42, "caption": "秀拉／大碗島的星期天下午／1884 ~ 1886 ／油彩‧畫布／205 x 308cm／美國芝加哥藝術中心藏", "description": ["秀拉在創作這幅作品的過程，為了讓顏色更精準，花了兩年的時間，畫了四百多幅素描和色彩效果圖。作品尺寸較為巨大，使觀看的人必需退至一定距離後，便能達到最佳的視覺混色效果。"], "images": [{"src": "images/42_0.jpg", "name": "圖 5-42秀拉Sunday Afternoon on the Island of la Grande Jatte.png"}]}, {"number": 43, "caption": "秀拉／庫伯瓦橋／ 1886／油彩‧畫布／ 45.7 x 54.6 cm／英國倫敦柯賽特藝廊", "description": ["這幅作品與＜大碗島的星期天下午＞一樣，以斜線切割畫面產生視覺上的動感，而右邊的樹，給了構圖的穩定感。在秀拉後期的作品當中，他的色點的混色技巧更為和諧，從局部放大的圖可以看到色點與色點之間細緻而規律排列著，甚至連簽名都以點描的方式呈現。"], "images": [{"src": "images/43_0.jpg", "name": "圖 5-43秀拉_庫伯瓦橋.jpg"}]}, {"number": 44, "caption": "這是\u003c庫伯瓦橋>的局部放大圖，大家可以找找看，秀拉的簽名在哪裡?", "description": [], "images": [{"src": "images/44_0.jpg", "name": "圖 5-44.JPG"}]}, {"number": 45, "caption": "秀拉／希涅克畫像／1890／炭精筆．素描紙／20 x 24cm／私人收藏", "description": [], "images": [{"src": "images/45_0.jpg", "name": "圖 5-45席涅克Seurat_Paul_Signac.jpg"}]}, {"number": 46, "caption": "希涅克／早餐／1886~1887／油彩‧畫布／ 89 x 115 cm／荷蘭克列拉．繆勒美術館藏", "description": ["細緻的點描筆觸，營造出陽光自窗戶投射到屋子裡的光影高、低的明暗變化，呈現畫面光亮的晨間溫馨用餐的景致。"], "images": [{"src": "images/46_0.jpg", "name": "圖 5-46.jpg"}]}, {"number": 47, "caption": "希涅克／聖卓佩茲港／1901／炭精筆．素描紙／131 x 161.5 cm／日本東京國立西洋美術館藏", "description": [], "images": [{"src": "images/47_0.jpg", "name": "圖 5-47.jpg"}]}, {"number": 48, "caption": "塞尚／有玫瑰背景的自畫像／ 1875 ／油彩．畫布／55 x 55 cm／私人收藏", "description": [], "images": [{"src": "images/48_0.jpg", "name": "圖 5-48.jpg"}]}, {"number": 49, "caption": "塞尚／靜物：蘋果與橘子／ 1895 ~ 1900 ／油彩．畫布／73 x 92 cm／法國巴黎羅浮宮藏", "description": ["塞尚對於空間、體積和透視的科學性並並不重視，而是注重畫面中形體和色彩之間的表現與佈局，追求創作上的和諧與均衡。"], "images": [{"src": "images/49_0.jpg", "name": "圖 5-49塞尚Still Life with Apples and Oranges.jpg"}]}, {"number": 50, "caption": "塞尚／玩紙牌的人／1890 ~ 1892／油彩．畫布／45 x 57cm／法國巴黎奧塞美術館藏", "description": ["塞尚一共創作過五幅相同主題的作品，他細心的觀察研究著場景與人物身上的細節，再以洗練的色彩規劃，表現出作品整體的真實感。"], "images": [{"src": "images/50_0.jpg", "name": "圖 5-50塞尚The Card Players.jpg"}]}, {"number": 51, "caption": "梵谷／自畫像／1889 ／油彩‧畫布／65 x 54 cm／法國巴黎奧賽美術館", "description": [], "images": [{"src": "images/51_0.jpg", "name": "圖 5-51梵谷_自畫像.jpg"}]}, {"number": 52, "caption": "梵谷／星夜／1889 ／油彩‧畫布／72 x 92 cm／美國紐約現代美術館", "description": ["作品中充滿力量的線條，順著夜空中空氣的流動，堆疊出由左向右進行的動勢。梵谷的星空，不只是自然現象的具象化，更是他的幻想與意志的體現。"], "images": [{"src": "images/52_0.jpg", "name": "圖 5-52梵谷The Starry Night.jpg"}]}, {"number": 53, "caption": "梵谷／麥田群鴉／1890 ／油彩．畫布／50.5 x 100.5cm／荷蘭阿姆斯特丹梵谷博物館", "description": ["梵谷晚年受精神疾病所苦，他在1890年去到巴黎北部村莊接受醫生治療，這幅作品表現出他內心的悲傷與極度的寂寞感，在創作完這幅作品之後的數星期後，他走進他描繪的那片麥田舉槍自盡受了重傷，兩天後在弟弟的陪伴之下，告別人了世。"], "images": [{"src": "images/53_0.jpg", "name": "圖 5-53梵谷Wheatfield with Crows.jpg"}]}]}, {"title": "野獸主義", "intro": ["自從印象主義為西洋的繪畫掀起一陣大革命之後，藝術家們開始尋求純粹自我的創作方式。這種風潮從十九世紀末一直帶到了二十世紀，一群藝術家在1905年巴黎的秋季沙龍展中，以豪放的筆觸、對比鮮明的色彩，將許多狂野、不受拘束的作品呈現在世人面前，企圖在他們的畫作與學院派風格的作品當中，畫出一條清楚的界線。從此，世人便稱這種有著強烈自我風格的藝術為野獸主義(Faurism)。", "野獸主義的作品，承襲了後印象派梵谷、高更等人的大膽用色，並進一步的放棄傳統透視、遠近比例與明暗…等，各種空間法則，畫作上常以活潑的色相對比與明度對比來強化視覺效果。"], "artists": [{"name": "馬諦斯(Henri Matisse, 1869~1954)", "bio": ["馬諦斯出生在法國北部，是一位糧食商人之子，家境富裕的他18歲去巴黎學習法律，畢業後返鄉擔任地方法院行政官。但在一次的盲腸炎住院的過程，他發現作畫能帶給他彷彿身在天堂般的樂趣，從此便立志當一名藝術家。而馬諦斯後來也成為了野獸派的創始人，以及最主要的代表人物。", "馬諦斯為了提昇純粹的色彩效果而將形狀單純化，並利用大面積的色塊來構成畫面。他認為繪畫不是重現自然，而是利用色彩來表現內心感動的情緒。"]}, {"name": "盧奧（Georges Rouault, 1871-1958）", "bio": ["盧奧是另一位野獸主義畫派中出色的畫家，他與馬諦斯兩人年輕時都曾是藝術家牟候(Gustave Moreau, 1826~1898)畫室中的得意門生，他的作品常使用厚重的黑色輪廓線，配合濃郁而粗野的色調，這樣的呈現方式，這樣的創作方式經常讓人與他曾當過彩色玻璃鑲嵌學徒的事聯想在一起。他創作的題材多以表現宗教的神聖意識為主，以「小丑」代表聖經裡的聖人；「妓女」代表災禍的來臨，以諷刺現實的方式來傳達他內心真正的信念。"]}], "works": [{"number": 54, "caption": "馬諦斯／自畫像／1900／油彩‧畫布／ 55 x 46 cm／法國巴黎龐畢度藝術中心藏", "description": [], "images": [{"src": "images/54_0.jpg", "name": "圖 5-54馬諦斯self-portrait-1900.jpg"}]}, {"number": 55, "caption": "馬諦斯／綠色條紋的馬諦斯夫人／1905 ／油彩‧畫布／40.5 x 325 cm／丹麥哥本哈根國立美術館", "description": ["馬諦斯以一條醒目的綠色條紋貫穿他妻子臉部中央，運用對比的色塊平塗，取代了利用明暗製造層次的傳統手法，大膽創新的表現方式對當時的藝壇產生強大的震撼。"], "images": [{"src": "images/55_0.jpg", "name": "圖 5-55馬諦斯Madame Matisse with Green Stripe.jpg"}]}, {"number": 56, "caption": "馬諦斯／舞蹈／1909-1910 ／油彩‧畫布／260 x 391 cm／ 俄羅斯聖彼得堡艾米塔吉博物館", "description": ["馬諦斯曾說過：「畫藍色並不代表天空，畫綠色並不代表草地，色彩如同音樂的和音，用色不在量多而要善用色彩相互調和的關係，才能表現繪畫的張力之美。」如同這幅作品當中，他利用簡單大膽的色調，搭配合協韻律的肢體動作，表現出生命的活力和喜悅。"], "images": [{"src": "images/56_0.jpg", "name": "圖 5-56.jpg"}]}, {"number": 57, "caption": "盧奧／工所學徒(自畫像)／1925／油彩‧畫布／ 52 x 66 cm／法國巴黎現代藝術博物館藏", "description": [], "images": [{"src": "images/57_0.jpg", "name": "圖 5-57盧奧Georges Rouaultartistsapprentice.jpg"}]}, {"number": 58, "caption": "盧奧／老國王／1937／54 x 77 cm ／油彩‧畫布／匹茲堡卡內基協會藝廊", "description": ["畫中色彩很強烈，有彩色玻璃花窗的效果。人物形象的外輪廓以非常粗重的黑線勾勒，用來限定形式和控制結構，此時作品已有帶有幾何抽象的風格。"], "images": [{"src": "images/58_0.jpg", "name": "圖 5-58Rouault老國王.jpg"}]}, {"number": 59, "caption": "盧奧／貴族的皮耶洛／1941~1942／172x71 cm／油彩‧畫布／私人收藏", "description": ["盧奧的作品中常見小丑的身影，小丑象徵著在人前製造歡笑，人後是痛苦的臉，表達人世最深的悲苦。身處貴族與中產階級交替的十八世紀，他透過繪畫控訴社會文明帶給中下階層人們精神上的磨難。"], "images": [{"src": "images/59_0.jpg", "name": "圖 5-59Rouault貴族的皮耶洛.jpg"}]}]}, {"title": "立體主義", "intro": ["立體主義(Cubism)的畫家，是繼野獸主義之後所產生的藝術風格。立體主義畫家們聚集在法國巴黎的蒙馬特區，研究著如何從自然形態的本身，追求其形態上的「美」。現代繪畫之父-塞尚(Paul Cézanne，1839～1906)曾說：「自然的一切，都可以簡化用球形、圓錐形、圓柱形去構成。」立體主義的畫家以塞尚的理論為基礎，放棄了從平面的角度去觀察物體的概念，認為繪畫應該從四面八方不同的角度去察物體的姿態，並且將這些不同的造型重新組合、拼湊在同一個畫面之中，創作出立體主義畫家們所認為的「完整」的藝術。"], "artists": [{"name": "畢卡索(Pablo Ruiz Picasso, 1881~1973)", "bio": ["畢卡索出生於西班牙，他一生的創作橫跨了各種主義與流派，而其中最具代表性的就是和布拉克共同創立的「立體主義」。他父親是位藝術教師，從小訓練他素描與油畫技法時便發現他驚人的繪畫天賦，19歲時他前往巴黎受到有印象主義的塞尚影響，對幾何形體的創作產生興趣，開始嘗試從物體的各不同的方位來了解事物的真實面貌，他盡可能的想在平面表現出深度，甚至時間感。", "\u003c格爾尼卡>是畢卡索非常經典的代表作，畫面中他以殘破的身軀、吶喊的人與馬，表達對於戰爭無情摧殘的控訴，透過單色調的畫面來傳達恐懼與悲傷的心情。對於1937年發生的西班牙內戰，他感到無奈而痛心。"]}, {"name": "布拉克(Georges Braque, 1882~1963)", "bio": ["布拉克生於法國，父親是一位建築設計師也是位業餘畫家，從小就接受過建築設計師訓練。布拉克與畢卡索兩人為共同開創立體主義畫派的領導人。", "布拉克喜歡以身邊常見的靜物為創作題材，如吉他、報紙、酒瓶等。創作時他致力研究如何將物體分析、拆解、並重新組合，以豐富變化的色塊表現立體感。他也曾在顏料上摻上細砂，使畫面顯得更厚重且真實。"]}], "works": [{"number": 60, "caption": "畢卡索／自畫像／1907／油彩‧畫布／51 x 42 cm／捷克共和國布拉格市國家畫廊", "description": [], "images": [{"src": "images/60_0.jpg", "name": "圖 5-60畢卡索self-portrait-1907.jpg"}]}, {"number": 61, "caption": "畢卡索／格爾尼卡／1936／油彩‧畫布／350 x 782.3 cm／美國紐約現代美術館藏", "description": ["使用黑灰白的單色調，搭配哭喊變形的人與動物，來呈現戰爭可怕殘忍的一面。"], "images": [{"src": "images/61_0.jpg", "name": "圖 5-61Guernica.jpg"}]}, {"number": 62, "caption": "畢卡索／亞維農少女／1907 ／油彩‧畫布／243 x 233 cm／美國紐約現代美術館", "description": ["畢卡索在受到馬諦斯和塞尚的影響之下，並從非洲的雕塑中得到創作靈感，創作這幅開創出立體主義的代表作。可以注意到畫面中央的兩位少女的臉部呈正面，但其鼻子以側面呈現，這種不同角度的視象被結合在同一個形象上，正是立體主義想表達的精神"], "images": [{"src": "images/62_0.jpg", "name": "圖 5-62畢卡索_亞維農姑娘.jpg"}]}, {"number": 63, "caption": "畢卡索／三個音樂家／1921 ／油彩‧畫布／200.7 x 223 cm／美國紐約現代美術館", "description": ["畫面中的人物被簡化成基本的幾合形，三位音樂家看似獨立，但卻又互相混合聯結。背景狗的形態被折解成各個不同的部位，散落在各處，彷彿將不同時間、與不同角度的動態凝結於畫面之中。"], "images": [{"src": "images/63_0.jpg", "name": "圖 5-63畢卡索_三個音樂家.jpg"}]}, {"number": 64, "caption": "布拉克／自畫像／", "description": [], "images": [{"src": "images/64_0.jpg", "name": "圖 5-64布拉克.jpg"}]}, {"number": 65, "caption": "布拉克／萊斯達克之屋／1908／油彩‧畫布／73 × 59.5 cm／瑞士波恩藝術博物館藏", "description": ["法國藝術評論家路易‧華克紹(Louis Vauxcelles)在第一次見到這幅作品時，既訝異於畫作的手法又驚豔地說：「這是立方體堆積而成的畫！」爾後「立體主義」(Cubism)這個新藝術名詞，才迅速被廣泛的使用，這幅作品與\u003c亞維農少女>都可以說是立體主義的起源。"], "images": [{"src": "images/65_0.jpg", "name": "圖 5-65 布拉克_萊斯達克之屋.jpg"}]}, {"number": 66, "caption": "布拉克／桌上的白蘭地酒瓶和吉他／1930／ 油彩‧畫布／130.5 x 75 cm／私人收藏", "description": ["這幅布拉克的經典作品之一，布拉克常以桌子上的靜物爲題材，在諸多靜物裡，布拉克尤其偏愛吉他，吉他被分解爲各種色彩、曲線、以及不規則形狀，奇妙地組合爲一種新的形態，色彩的運用富於裝飾性，顯示出畫家對材料、質地、裝飾圖案以及顏色運用方面的創造力。"], "images": [{"src": "images/66_0.jpg", "name": "圖 5-66 布拉克_桌上的白蘭地酒瓶和吉他.jpg"}]}]}, {"title": "超現實主義", "intro": ["心理學家弗洛依德(Sigmund Freud, 1856~1939)在《精神分析學說》中提到人們的真正思想、真正面目，是隱藏在潛意識及夢裡的，要真正了解一個人，就必須先了解他的夢。」超現實主義(Sur-realism)的畫家們正是受到了弗洛依德的理論影響，他們認為真正的「美」應該就藏於潛意識之中。他們開始研究人們無意識下的塗鴉、研究人們的夢境和幻想、研究小孩或精神病患的書畫…等，之後便發展出這一種超脫形態之外的藝術風格。超現實主義的畫家強調「自由自在的生活在時空交錯的世界中」以及「反傳統」，他們憑本能及想像，表現超越現實的題材，不受到時間與空間的束縛，將各種事物重新並列、解析、組合，作品中充滿了奇幻、詭異、夢境般的情景。", "超現實主義主要流行於第一次世界大戰到第二次世界大戰間的歐洲地區，在第二次世界大戰爆發前夕，許多歐洲的超現實主義畫家，紛紛遷往美國。很快的，這種「擺脫傳統束縛」的創作觀念便普及全世界，進而影響了往後的現代藝術風格。"], "artists": [{"name": "達利(Salvador DALI, 1904~1989)", "bio": ["達利出生在西班牙馬德里，從小家庭經濟優渥，父母親支持他從事藝術創作。年輕時在馬德里和巴賽隆納的美術學院就讀，求學期間受前衛畫家奇里訶(Giorgio De Chirico, 1888~1978)的影響，並且研究掌握各種藝術風格。達利22歲時到了巴黎，結識他深深敬偑的畫家畢卡索，並且深受影響。", "達利著迷於佛洛低德的精神分析理論，作品中充滿怪誕奇幻的景像，他以精密且寫實的技法，描繪出真實生活與潛意識世界的交錯時空，獨特又強烈的視覺效果，使他成為超現實主義繪畫中的影響最大，持續的時間也最長的畫家。"]}, {"name": "米羅(Joan Miró, 1893~1983)", "bio": ["米羅出生於西班牙巴塞隆納，早期創作從寫實著手，經歷野獸主義、立體主義、到後來他的創作越趨抽象。作品經常以純粹的構圖和記號的組合來表達他的世界觀，呈現出看似神秘又極富想像力的畫面。「色彩」與「符號」是他創作過程兩個重要的元素，他曾說過：「我嘗試運用色彩就像以字詞作詩、以音符譜曲。」他企圖要擺脫理性和邏輯束縛，把無意識的和感性的心靈釋放出來。米羅與畢卡索、達利被喻為二十世紀西班牙最具代表性的畫家。"]}], "works": [{"number": 67, "caption": "達利╱柔軟的自畫像和煙燻肉╱ 1941 ╱油彩．畫布╱ 61 x 50 ╱ 西班牙達利戲劇博物館藏", "description": [], "images": [{"src": "images/67_0.jpg", "name": "圖 5-67達利自畫像.jpg"}]}, {"number": 68, "caption": "達利／蜜蜂的飛行／ 1944 ／油彩‧畫布／ 油彩．畫布／ 51 x 40.5 cm／西班牙馬德里提森波那米薩美術館藏", "description": ["這幅作品是在描繪的達利愛人-卡拉的一個夢境，一個由於蜜蜂的蜇刺而引起的荒誕離奇的夢。為了創作出奇異怪誕的作品，達利在強迫自己坐在畫布前睡覺，在半睡半醒之際把夢境中的毫無邏輯性可言的情境直接表達在畫布之上。"], "images": [{"src": "images/68_0.jpg", "name": "圖 5-68 達利_蜜蜂的飛行.jpg"}]}, {"number": 69, "caption": "達利／時光靜止／ 1931 ／油彩．畫布／ 24.1 x 33 ／ 紐約現代美術館藏", "description": [], "images": [{"src": "images/69_0.jpg", "name": "圖 5-69 達利_時光靜止.jpg"}]}, {"number": 70, "caption": "米羅╱自畫像╱ 1919 ╱油彩．畫布╱ 75 x 60 ╱ 法國巴黎畢卡索美術館藏", "description": [], "images": [{"src": "images/70_0.jpg", "name": "圖 5-70miro.jpg"}]}, {"number": 71, "caption": "米羅／不眠之夜／ 1950 ／油彩．畫布／88.9 x 115.3 ／紐約現代美術館藏", "description": ["米羅的作品中常可看見一些特別的符號，其中常出現的如：星星、太陽、眼睛、梯子、女人等，(他曾說過他作品中的女人代表的是 “宇宙”)在這幅作品中，你找到了幾種呢?"], "images": [{"src": "images/71_0.jpg", "name": "圖 5-71米羅-不眠之夜.jpg"}]}, {"number": 72, "caption": "米羅／蔚藍的金色／1967／油彩．畫布／205 x 173.5 ／班牙巴塞隆那米羅基金會美術館藏", "description": ["這幅畫看起來輕快、自由、無拘無束，但事實上卻是深思熟慮，精湛計算的結果。", "他的作品看似簡單，但卻沒有稚嫩、或扭劣之感。"], "images": [{"src": "images/72_0.jpg", "name": "圖 5-72joan-miro.jpg"}]}]}, {"title": "抽象表現主義", "intro": ["在第二次世界大戰之後，藝術創作的風潮從歐洲帶往了美國，抽象表現主義(Abstract Expressionism,)便是在這時期流行的藝術風格。但是「抽象表現」所指的並非某種特定的藝術團體或流派，而是種風格的概稱。創作者憑藉著自身的想像力和創造力，從自然物象或是幾何圖形當中尋找素材，單純以線條或色彩構成「非具象的美感」。抽象表現主義的畫家多具有自由的信念、與批判的精神。他們技巧的表現是自由不受拘束的，創作的過程是即興、動感、有生命力的，畫家在創作的過程中企圖尋找自我，以及純粹的美感。"], "artists": [{"name": "波洛克（Jackson Pollock, 1912~1956）", "bio": ["波洛克出生於美國，曾在西部度過童年，17歲時才到紐學習繪畫。早期他的作品受到立體主義、與超現實主義的影響，但漸漸的他認為繪畫是有生命的，畫家應該要任其發展，而不是重現任何事物，因此主題從他的畫作上消失了，只留下抽象的視覺效果。他開始把畫布鋪在地板，發展出了後來被稱為「滴畫」的繪畫技巧。此時，波洛克把這種家用油漆塗料混入沙子、石膏等不同物質，隨意的灑落在畫布上，畫面上找不到視線的中心點，他大膽的開創出抽象繪畫新的可能性。波洛克潑灑和滴落顏料的技巧被認為是「行動繪畫」的起源之一。", "他不希望觀眾因為畫作名稱，而對作品產生先入為主的具體意象，因此放棄了對作品的命名，轉而使用編號。波洛克曾說過：「被動地接受這幅畫提供的意象，而不要帶著主觀印象去尋找主題。」"]}], "works": [{"number": 73, "caption": "波洛克於紐約工作室作畫的過程", "description": [], "images": [{"src": "images/73_0.jpg", "name": "圖 5-73 波洛克Pollock at Work, 1950.jpg"}]}, {"number": 74, "caption": "波洛克／母狼／1943 ／油彩‧石膏‧畫布／106.36 x 170.18 cm／美國紐約現代美術館", "description": ["早期的作品當中，仍隱約可見創作主題與造形意象，但是他已經逐漸的發展出在畫布上真接潑灑油漆的繪畫技巧。"], "images": [{"src": "images/74_0.jpg", "name": "圖 5-74波洛克／母狼The-She-Wolf.jpg"}]}, {"number": 75, "caption": "波洛克／編號5／1950 ／油彩‧亮漆‧畫布／2.4 x 1.2 m／私人收藏", "description": ["「滴畫」時期的作品是他最廣為人知的作品風格，畫面上的線條、色彩與任何具體事物毫無關聯，展現出繪畫最單純也最原始的生命力。此幅作品在2006年的拍賣會上以1.4億美金售出，創下他畫作售價的最高金額。", "羅斯科(Marks Rotko, 1903~1970)", "羅斯科出生於俄國，10歲時移民至美國，他早期以超現實主義風格作品在美國藝壇占有一席之地，但後來他認為藝術應該注重精神內涵的表達，因此力圖透過有限的色彩和極簡的形狀來反映深刻的象徵意義。他說：「我對色彩與形式的關係以及其它的關係並沒有興趣……我唯一感興趣的是表達人的基本情緒，悲劇的、狂喜的、毀滅的等等。」羅斯科的作品尺寸都非常的巨大，他認為大型的作品可以更直接的進行溝通交涉，能把觀眾帶進繪畫之中。"], "images": [{"src": "images/75_0.jpg", "name": "圖 5-75No-5-1948-by-Jackson-Pollock.jpg"}]}, {"number": 76, "caption": "羅斯科／自畫像／1936 ／油彩‧畫布／55 x 46／美國波特蘭美術館藏", "description": [], "images": [{"src": "images/76_0.jpg", "name": "圖 5-76羅斯科rothko.jpg"}]}, {"number": 77, "caption": "羅斯科／5號/22號;1950／1949 ／油彩‧畫布／297 x 272 cm／美國紐約現代美術館藏", "description": ["在羅斯科的作品常見到由三個排列整理的矩形色塊構成，他希望能夠透過有限的色彩及極簡的幾何形，來表達他內心真正的想法。"], "images": [{"src": "images/77_0.jpg", "name": "圖 5-77No.-5-No.-22.jpg"}]}, {"number": 78, "caption": "羅斯科／14號作品／ 1960／油彩‧畫布／291 x 268 cm／美國舊金山現代美術館", "description": [], "images": [{"src": "images/78_0.jpg", "name": "圖 5-78.jpg"}]}]}], "introImages": [{"number": 1, "images": [{"src": "images/01_0.jpg", "name": "圖 5-01.JPG"}]}, {"number": 2, "images": [{"src": "images/02_0.jpg", "name": "圖 5-02《自畫像》於臺南文化中心展出.jpg"}]}], "totalImages": 81, "preface": {"title": "西洋近代繪畫前言", "paragraphs": ["自從14世紀的一場重要的文化運動-文藝復興(Rinascimento)之後，人們逐漸擺脫宗教的束縛走向人文主義，文藝復興時期的人們，重視古代的古典思維(古希臘、羅馬時期)，講求理性、科學。藝術家也從15世紀後開始關注大眾的日常生活。隨後到了17、18世紀，希望在表現風格上作更大膽突破的藝術風格-「巴洛克」(Baroque)、「洛可可」(Rococo)也逐一出現，並且影響著往後的藝術發展。", "時至今日，西洋近代藝術風格的形成與演變，一直是藝術家們創作過程中重要的靈感來源，我們可以從過去的歷史當中鑑古知今，學習前人的智慧及技法，進而發展出新時代的創新風格。因此本章節將針對19世紀之後，幾個較具代表性的藝術風格逐一介紹。"], "works": [{"number": 1, "caption": "圖 5-1余宜庭／玩命拆屋／2013／水彩．水彩紙／54 x 39 cm／私人收藏", "description": ["透過經典名作的模仿以及挪用，來詮釋當代社會議題，現代藝術創作者受到近代繪畫史的影響，可組合出更多元且豐富的表現方式來傳遞訊息。"], "images": [{"src": "images/01_0.jpg", "name": "圖 5-01"}]}, {"number": 2, "caption": "圖 5-2陳澄波／自畫像1927／油彩．畫布／41×31.5cm／畫家家族收藏", "description": ["台灣前輩畫家陳澄波，曾留學日本受正統學院派藝術教育，受印象主義風格影響至深，從他這幅自畫像中可以看到其構圖、色彩、筆觸皆有著向後印象主義大師-梵谷致敬的意味。"], "images": [{"src": "images/02_0.jpg", "name": "圖 5-02"}]}, {"number": 3, "caption": "圖 5-3馬克．馬里倫哥(Marco Marilungo, 1971~)／藝術史：前衛藝術／2012／電腦繪圖／32 x 42 cm／私人收藏", "description": ["插畫家馬克．馬里倫哥以同一主題「蒼蠅殺手」，配合藝術史上16種表現風格，組合出一張趣味性十足的海報，從海報中我們可以很清楚的一窺各種藝術風格的表現技法與特色。"], "images": [{"src": "images/03_0.jpg", "name": "圖 5-03"}]}]}, "interludes": {"9": {"title": "浪漫主義(Romanticism)", "paragraphs": ["在新古典主義之後，有另一批藝術家認為一昧的模仿、崇拜舊時代的古典藝術，思想頑固、亦缺乏情趣，對於生活的熱情也被壓抑，因此誕生了強調大膽創新的「浪漫主義」。「浪漫」一詞來自於「Romance」代表了源於中世紀文學和浪漫文學裡頌揚英雄的詩賦風格。他們追求愛情、信念、希望和恐懼等人們心中最真實的情感，", "這種思想在法國恰巧與提倡冷靜且理性的新古典主義產生衝突，此後新古典主義與浪漫主義便開始了將近半世紀的對立與爭辯。無論是代表「新古典」的安格爾、還是代表「浪漫主義」的德拉克洛瓦，理念上雖然對立、但仍是十九世紀相當偉大的藝術家，他們的藝術風格也分別影響了許多後世的偉大藝術家。"]}, "40": {"title": "新印象主義(Neo-Impressionism)", "paragraphs": ["在印象派興起之後，許多藝術家都在尋找新的表現方式，新印象主義的藝術家們運用科學化的描寫法追求對光的表現。畫家們在畫布上使用純色直接作畫，不在調色板上調混顏料，以細緻的彩色小點來堆疊色塊，當觀賞者從一定的距離觀賞畫作時，這些色點會在眼中自然混合而產生新的色彩。這樣的色彩表現方式，後來被稱作「視網膜混色」或是「並置混色」，而新印象主義也被稱作「點描畫派」。"]}, "47": {"title": "後印象主義(Post-Impressionism)", "paragraphs": []}}}</script><script>
const D=JSON.parse(document.getElementById('siteData').textContent), E=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const years=['1760–1850','1830–1870','1870–1905','1905–1915','1907–1925','1920–1945','1940–1960'];
function openPic(src,label){document.getElementById('big').src=src;document.getElementById('bigLabel').textContent=label;document.getElementById('viewer').classList.add('open')}
const nav=document.getElementById('timeline'),container=document.getElementById('sections');
const periodColors=['#e6effb','#fce9e6','#e5f3e9','#fff0d7','#ede8fb','#e2f3f4','#f7e7f1'];
const prefaceColor='#e8eee9';

nav.insertAdjacentHTML('beforeend',`<button style="--chapter-color:${prefaceColor}" onclick="document.getElementById('preface').scrollIntoView({behavior:'smooth'})">西洋近代繪畫前言</button>`);
function workCard(w){let pics=w.images||[];let hero=pics[0]?`<img loading="lazy" src="${E(pics[0].src)}" alt="${E(w.caption)}" data-src="${E(pics[0].src)}" data-label="${E(w.caption)}">`:`<div class="missing">此作品尚未配對到圖片</div>`;let extras=pics.length>1?`<div class="extras">${pics.slice(1).map(p=>`<img loading="lazy" src="${E(p.src)}" alt="補充圖" data-src="${E(p.src)}" data-label="${E(w.caption)}">`).join('')}</div>`:'';let label=String(w.number).includes('-')?w.number:String(w.number).padStart(2,'0');return `<article class="work">${hero}${extras}<div class="info"><div class="num">圖 5-${E(label)}</div><h4>${E(w.caption)}</h4>${w.description.map(v=>`<p>${E(v)}</p>`).join('')}</div></article>`}
container.insertAdjacentHTML('beforeend',`<section class="section" id="preface" style="--chapter-color:${prefaceColor}"><div class="kicker">INTRODUCTION · 閱讀起點</div><h2>${E(D.preface.title)}</h2><div class="lead">${D.preface.paragraphs.map(p=>`<p>${E(p)}</p>`).join('')}</div><div class="works">${D.preface.works.map(workCard).join('')}</div></section>`);
D.sections.forEach((s,i)=>{let id='period'+i;nav.insertAdjacentHTML('beforeend',`<button style="--chapter-color:${periodColors[i]}" onclick="document.getElementById('${id}').scrollIntoView({behavior:'smooth'})">${E(s.title)} · ${years[i]||''}</button>`);let intros=s.intro.map(v=>typeof v==='string'?`<p>${E(v)}</p>`:`<h3 class="subhead">${E(v.subhead)}</h3>`).join('');let artists=s.artists.map(a=>`<div class="artist"><h3>${E(a.name)}</h3>${a.bio.map(v=>`<p>${E(v)}</p>`).join('')}</div>`).join('');let works=s.works.map(w=>{let block=workCard(w);let interlude=D.interludes[String(w.number)];return block+(interlude?`<div class="interlude"><h3>${E(interlude.title)}</h3>${interlude.paragraphs.map(p=>`<p>${E(p)}</p>`).join('')}</div>`:'')}).join('');container.insertAdjacentHTML('beforeend',`<section class="section" id="${id}" style="--chapter-color:${periodColors[i]}"><div class="kicker">PERIOD ${String(i+1).padStart(2,'0')} · ${years[i]||''}</div><h2>${E(s.title)}</h2><div class="lead">${intros}</div>${artists}<div class="works">${works}</div></section>`)});
document.addEventListener('click',e=>{let img=e.target.closest('img[data-src]');if(img)openPic(img.dataset.src,img.dataset.label)});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('viewer').classList.remove('open')});
const ob=new IntersectionObserver(entries=>{entries.forEach(x=>{if(x.isIntersecting){document.querySelectorAll('.timeline button').forEach((b,i)=>b.classList.toggle('active',x.target.id===(i===0?'preface':'period'+(i-1))))}})},{rootMargin:'-110px 0px -65% 0px'});document.querySelectorAll('.section').forEach(s=>ob.observe(s));// section navigation preserved
const bannerPictures=[...D.preface.works,...D.sections.flatMap(s=>s.works)].flatMap(w=>(w.images||[]).map(p=>p.src)).filter(Boolean);
if(bannerPictures.length){const chosen=bannerPictures[Math.floor(Math.random()*bannerPictures.length)];document.querySelector('header').style.backgroundImage=`linear-gradient(90deg,rgba(17,29,35,.91),rgba(17,29,35,.62)),url("${encodeURI(chosen)}")`;}

</script></body></html>
